<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金魚缸 — 每日儲值</title>
<style>
/* === VARIABLES === */
:root {
  --gold: #FFD700;
  --gold-dark: #B8860B;
  --gold-light: #FFF0A0;
  --aqua: #00CED1;
  --aqua-dark: #008B8B;
  --aqua-light: #7FFFD4;
  --coral: #FF6347;
  --bg-deep: #0A0E1A;
  --bg-panel: rgba(10,20,40,0.95);
  --bg-dialog: linear-gradient(160deg, #0D1B3E 0%, #0A2440 60%, #061830 100%);
  --text-main: #F5E6C8;
  --text-dim: #8899AA;
  --border-gold: rgba(255,215,0,0.4);
  --shadow-gold: 0 0 20px rgba(255,215,0,0.3);
  --radius: 16px;
  --radius-sm: 8px;
}

/* === LAYOUT === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-deep);
  font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#app {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Lobby background */
#lobby {
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 50% 30%, #1a2a4a 0%, #0A0E1A 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.lobby-title {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  color: var(--gold);
  letter-spacing: 4px;
  opacity: 0.6;
}

/* Entry icon */
#entry-icon {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, #1a3a6a, #0d2244);
  border: 2px solid var(--border-gold);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-gold);
  transition: transform 0.15s, box-shadow 0.15s;
  user-select: none;
}
#entry-icon:active { transform: scale(0.93); }
#entry-icon .icon-fish { font-size: 28px; line-height: 1; }
#entry-icon .icon-bonus {
  font-size: 11px;
  color: var(--gold);
  font-weight: 700;
  margin-top: 2px;
}
#entry-icon .icon-label {
  font-size: 9px;
  color: var(--text-dim);
  margin-top: 1px;
}
#entry-icon .badge-first {
  position: absolute;
  top: -6px; right: -6px;
  background: var(--coral);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 6px;
  white-space: nowrap;
}

/* === COMPONENTS === */

/* Overlay */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 400;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#overlay.show {
  opacity: 1;
  pointer-events: all;
}

/* Dialog base */
.dialog-box {
  background: var(--bg-dialog);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,0.8), var(--shadow-gold);
  width: min(400px, 94vw);
  max-height: 92vh;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  scrollbar-width: none;
}
.dialog-box::-webkit-scrollbar { display: none; }

/* Dialog sections */
.dialog-header {
  padding: 16px 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
}
.dialog-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 0 12px rgba(255,215,0,0.5);
}
.dialog-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border-gold);
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, border-color 0.2s;
}
.dialog-close:hover { color: var(--gold); border-color: var(--gold); }

.dialog-meta {
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.vip-badge {
  background: linear-gradient(90deg, #2a4a1a, #3a6a2a);
  border: 1px solid #5a9a3a;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  color: #90dd60;
  font-weight: 600;
}
.countdown {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: auto;
}
.countdown span { color: var(--aqua); font-weight: 600; }

/* Degradation warning */
.degrade-warn {
  margin: 0 16px 8px;
  background: rgba(255,99,71,0.15);
  border: 1px solid rgba(255,99,71,0.4);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 12px;
  color: #ff8c70;
  display: none;
  align-items: center;
  gap: 6px;
}
.degrade-warn.show { display: flex; }

/* Fish tank area */
.tank-wrap {
  margin: 8px 16px;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  height: 180px;
  border: 2px solid var(--border-gold);
}
.tank-bg {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.8s;
}
/* Tank backgrounds */
.tank-bg.bg-plain   { background: linear-gradient(180deg, #b8e4f0 0%, #7ac5d8 50%, #5aa8c0 100%); }
.tank-bg.bg-seaweed { background: linear-gradient(180deg, #90d4e8 0%, #60b8cc 50%, #3a9ab0 100%); }
.tank-bg.bg-coral   { background: linear-gradient(180deg, #70c8e0 0%, #50a8c8 50%, #2a8aac 100%); }
.tank-bg.bg-stone   { background: linear-gradient(180deg, #5090a8 0%, #406888 50%, #305070 100%); }
.tank-bg.bg-golden  { background: linear-gradient(180deg, #8a6010 0%, #603808 50%, #402000 100%); }

/* Water shimmer overlay */
.tank-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 40px,
    rgba(255,255,255,0.06) 40px,
    rgba(255,255,255,0.06) 42px
  );
  animation: waterShimmer 3s linear infinite;
  pointer-events: none;
}

/* Tank decorations */
.tank-deco {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 30px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.3));
}
.tank-deco::before {
  content: '🪸🌿🪨🌿🪸';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  letter-spacing: 4px;
}

/* Fish */
#fish-display {
  font-size: 60px;
  position: relative;
  z-index: 2;
  transition: font-size 0.6s cubic-bezier(0.34,1.56,0.64,1), filter 0.6s, opacity 0.6s;
  display: inline-block;
  animation: fishSwim 4s ease-in-out infinite;
  cursor: default;
  user-select: none;
}
#fish-display.stagnant {
  filter: saturate(0.4) brightness(0.8);
  animation: fishSwimSlow 8s ease-in-out infinite;
}
#fish-display.degraded {
  filter: saturate(0.3) brightness(0.7);
  animation: fishSink 5s ease-in-out infinite;
}

.tank-info {
  position: absolute;
  bottom: 34px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 3;
}
.tank-level {
  font-size: 11px;
  color: rgba(255,255,255,0.9);
  background: rgba(0,0,0,0.4);
  padding: 2px 10px;
  border-radius: 10px;
  white-space: nowrap;
}
.tank-accumulated {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 10px;
  color: var(--gold-light);
  background: rgba(0,0,0,0.5);
  padding: 3px 8px;
  border-radius: 8px;
  z-index: 3;
}

/* Amount selector */
.amount-row {
  display: flex;
  gap: 8px;
  padding: 0 16px;
  margin: 10px 0 0;
}
.amount-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-gold);
  background: rgba(255,215,0,0.07);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  user-select: none;
}
.amount-btn.active {
  background: rgba(255,215,0,0.18);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 8px rgba(255,215,0,0.2);
}
.amount-btn:active { transform: scale(0.96); }
.amount-btn .amt-ndt { font-size: 11px; font-weight: 400; color: var(--text-dim); margin-top: 2px; }

/* Pre-purchase copy */
.pre-copy {
  padding: 8px 16px 0;
  font-size: 12px;
  color: var(--aqua-light);
  text-align: center;
  min-height: 20px;
}

/* Buy button */
.buy-btn {
  margin: 10px 16px;
  width: calc(100% - 32px);
  padding: 14px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s, opacity 0.2s;
  user-select: none;
}
.buy-btn.active {
  background: linear-gradient(90deg, #B8860B, #FFD700, #B8860B);
  background-size: 200% 100%;
  color: #1a0a00;
  animation: btnShine 2.5s linear infinite;
  box-shadow: 0 4px 20px rgba(255,215,0,0.4);
}
.buy-btn.purchased {
  background: rgba(255,255,255,0.08);
  color: var(--text-dim);
  cursor: not-allowed;
}
.first-label {
  display: block;
  font-size: 10px;
  color: var(--coral);
  font-weight: 600;
  margin-bottom: 2px;
  letter-spacing: 1px;
}

/* Upgrade hint */
.upgrade-hint {
  margin: 0 16px 12px;
  padding: 8px 12px;
  background: rgba(0,206,209,0.1);
  border: 1px solid rgba(0,206,209,0.3);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--aqua-light);
  text-align: center;
  display: none;
}
.upgrade-hint.show { display: block; }

/* === FIRST-TIME DIALOG === */
#dialog-first .tank-wrap-first {
  margin: 12px 16px;
  height: 120px;
  background: linear-gradient(180deg, #c8ecf8, #90d0e8);
  border-radius: 14px;
  border: 2px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
#dialog-first .tank-wrap-first::after {
  content: '🌿🪸🌿';
  position: absolute;
  bottom: 6px;
  font-size: 18px;
  letter-spacing: 8px;
}
#fish-first {
  font-size: 48px;
  animation: fishSwim 3s ease-in-out infinite;
  position: relative;
  z-index: 2;
}
.first-promo {
  margin: 0 16px 8px;
  text-align: center;
  font-size: 13px;
  color: var(--gold-light);
}
.first-promo strong { color: var(--gold); font-size: 20px; }

/* === ANIMATION OVERLAY === */
#anim-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  pointer-events: none;
  display: none;
}
#anim-overlay.show { display: block; }

.anim-center {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}
.food-drop {
  font-size: 28px;
  animation: foodFall 0.8s ease-in forwards;
}
.grow-flash {
  font-size: 80px;
  animation: growPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
.coin-fly {
  position: absolute;
  font-size: 22px;
  animation: coinFly 1s ease-out forwards;
}
.coin-result {
  font-size: 28px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.8);
  animation: fadeUp 1s ease-out 0.8s both;
}
.gift-box {
  font-size: 56px;
  animation: giftRise 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
  cursor: pointer;
  pointer-events: all;
}
.gift-open-msg {
  font-size: 14px;
  color: var(--gold-light);
  margin-top: 8px;
  animation: fadeIn 0.4s ease both;
}
.tomorrow-preview {
  background: rgba(10,20,40,0.95);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius);
  padding: 20px 24px;
  text-align: center;
  max-width: 280px;
  animation: fadeIn 0.4s ease both;
}
.tomorrow-preview h3 { color: var(--gold); font-size: 15px; margin-bottom: 8px; }
.tomorrow-preview p { font-size: 13px; color: var(--text-main); line-height: 1.6; }
.tomorrow-preview .fish-preview { font-size: 48px; margin: 10px 0; }
.preview-close {
  margin-top: 12px;
  padding: 8px 24px;
  background: var(--gold);
  color: #1a0a00;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  pointer-events: all;
}

/* === ANIMATIONS === */
@keyframes fishSwim {
  0%,100% { transform: translateX(-10px) scaleX(1); }
  50%      { transform: translateX(10px) scaleX(-1); }
}
@keyframes fishSwimSlow {
  0%,100% { transform: translateX(-6px) scaleX(1) translateY(4px); }
  50%      { transform: translateX(6px) scaleX(-1) translateY(-2px); }
}
@keyframes fishSink {
  0%,100% { transform: translateX(-4px) scaleX(1) translateY(8px); }
  50%      { transform: translateX(4px) scaleX(-1) translateY(4px); }
}
@keyframes waterShimmer {
  0%   { background-position-x: 0; }
  100% { background-position-x: 82px; }
}
@keyframes btnShine {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes foodFall {
  0%   { opacity: 1; transform: translateY(-60px); }
  100% { opacity: 0; transform: translateY(60px); }
}
@keyframes growPop {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes coinFly {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--cx), var(--cy)) scale(0.5); }
}
@keyframes fadeUp {
  0%   { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes giftRise {
  0%   { opacity: 0; transform: translateY(60px) scale(0.5); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}
@keyframes goldGlow {
  0%,100% { text-shadow: 0 0 8px rgba(255,215,0,0.4); }
  50%      { text-shadow: 0 0 20px rgba(255,215,0,0.9); }
}

/* === DEBUG PANEL === */
#debug-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(5,10,20,0.95);
  border-top: 1px solid rgba(255,215,0,0.25);
  padding: 8px 12px;
  z-index: 300;
  display: none;
}
#debug-panel.show { display: block; }
#debug-toggle {
  position: fixed;
  bottom: 8px; right: 8px;
  background: rgba(5,10,20,0.9);
  border: 1px solid rgba(255,215,0,0.3);
  color: var(--text-dim);
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  z-index: 301;
}
.debug-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 4px;
}
.debug-label {
  font-size: 10px;
  color: var(--text-dim);
  min-width: 60px;
}
.debug-btn {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: var(--text-main);
  cursor: pointer;
  transition: background 0.1s;
}
.debug-btn.active {
  background: rgba(255,215,0,0.2);
  border-color: var(--gold);
  color: var(--gold);
}
.debug-btn:active { background: rgba(255,255,255,0.15); }

/* Scrollbar hide on mobile */
@media (max-width: 420px) {
  .dialog-box { width: 100vw; border-radius: 16px 16px 0 0; }
  #overlay { align-items: flex-end; }
}
</style>
</head>
<body>
<div id="app">

  <!-- Lobby -->
  <div id="lobby">
    <div class="lobby-title">神來也娛樂城</div>
    <div id="entry-icon" onclick="openDialog()">
      <div class="icon-fish" id="entry-fish">🐟</div>
      <div class="icon-bonus" id="entry-bonus">+100%</div>
      <div class="icon-label">金魚缸</div>
      <div class="badge-first" id="badge-first">首次限定</div>
    </div>
    <div style="text-align:center; color: rgba(255,215,0,0.3); font-size:14px;">
      點擊左上角圖示開啟金魚缸
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay" onclick="handleOverlayClick(event)">

    <!-- First-time Dialog -->
    <div class="dialog-box" id="dialog-first" style="display:none">
      <div class="dialog-header">
        <span class="dialog-title">🐟 金魚缸</span>
        <button class="dialog-close" onclick="closeDialog()">✕</button>
      </div>
      <div class="dialog-meta">
        <span style="font-size:11px; color:var(--text-dim)">首次限定優惠</span>
        <span class="countdown">換日倒數 <span id="cd-first">11:42:07</span></span>
      </div>
      <div id="dialog-first" style="display:contents">
        <div class="tank-wrap-first">
          <div id="fish-first">🐟</div>
        </div>
        <div class="first-promo">
          首次餵食限定・今日加贈<br>
          <strong id="first-bonus-pct">+100%</strong> 神幣
        </div>
        <div style="padding: 0 16px; text-align:center; font-size:11px; color:var(--text-dim); margin-bottom:8px">
          每日購買，魚從小金魚成長為龍魚，成長無上限！
        </div>
        <div class="amount-row" id="amount-row-first"></div>
        <div class="pre-copy" id="pre-copy-first">今日加贈 +100%，立即體驗！</div>
        <div class="buy-btn active" id="buy-btn-first" onclick="handleBuy('first')">
          <span class="first-label">✦ 首次限定優惠 ✦</span>
          首次餵食・NT$<span id="first-price">130</span>・加贈 <span id="first-pct">+100%</span>
        </div>
      </div>
    </div>

    <!-- Standard Dialog -->
    <div class="dialog-box" id="dialog-standard" style="display:none">
      <div class="dialog-header">
        <span class="dialog-title">🐟 金魚缸</span>
        <button class="dialog-close" onclick="closeDialog()">✕</button>
      </div>
      <div class="dialog-meta">
        <span class="vip-badge" id="vip-badge">一般探索員 · +100%</span>
        <span class="countdown">換日 <span id="cd-std">11:42:07</span></span>
      </div>
      <div class="degrade-warn" id="degrade-warn">
        ⚠️ <span id="degrade-msg">魚變小了！快回來餵食</span>
      </div>

      <!-- Fish tank -->
      <div class="tank-wrap">
        <div class="tank-bg bg-plain" id="tank-bg">
          <div id="fish-display">🐟</div>
          <div class="tank-deco"></div>
          <div class="tank-info">
            <div class="tank-level" id="tank-level-label">第 1 級・幼魚</div>
          </div>
          <div class="tank-accumulated" id="tank-accum">本週加贈 0 神幣</div>
        </div>
      </div>

      <!-- Amount selector -->
      <div class="amount-row" id="amount-row-std"></div>

      <!-- Pre-purchase copy -->
      <div class="pre-copy" id="pre-copy-std"></div>

      <!-- Buy button -->
      <div class="buy-btn active" id="buy-btn-std" onclick="handleBuy('std')"></div>

      <!-- Upgrade hint -->
      <div class="upgrade-hint" id="upgrade-hint"></div>
    </div>

  </div><!-- /overlay -->

  <!-- Animation overlay -->
  <div id="anim-overlay"></div>

</div><!-- /app -->

<!-- Debug toggle -->
<button id="debug-toggle" onclick="toggleDebug()">🛠 Debug</button>

<!-- Debug panel -->
<div id="debug-panel">
  <div class="debug-row">
    <span class="debug-label">玩家類型</span>
    <button class="debug-btn active" id="db-first" onclick="setPlayerType('first')">首次玩家</button>
    <button class="debug-btn" id="db-return" onclick="setPlayerType('return')">回訪玩家</button>
    <button class="debug-btn" id="db-done" onclick="setPlayerType('done')">今日已購</button>
  </div>
  <div class="debug-row">
    <span class="debug-label">連簽天數</span>
    <button class="debug-btn active" id="db-d1" onclick="setDay(1)">D1</button>
    <button class="debug-btn" id="db-d2" onclick="setDay(2)">D2</button>
    <button class="debug-btn" id="db-d3" onclick="setDay(3)">D3</button>
    <button class="debug-btn" id="db-d4" onclick="setDay(4)">D4</button>
    <button class="debug-btn" id="db-d5" onclick="setDay(5)">D5</button>
    <button class="debug-btn" id="db-d6" onclick="setDay(6)">D6</button>
    <button class="debug-btn" id="db-d7" onclick="setDay(7)">D7+</button>
  </div>
  <div class="debug-row">
    <span class="debug-label">魚級</span>
    <button class="debug-btn active" id="db-fl1" onclick="setFishLevel(1)">Lv1</button>
    <button class="debug-btn" id="db-fl3" onclick="setFishLevel(3)">Lv3</button>
    <button class="debug-btn" id="db-fl5" onclick="setFishLevel(5)">Lv5</button>
    <button class="debug-btn" id="db-fl7" onclick="setFishLevel(7)">Lv7</button>
    <button class="debug-btn" id="db-fl9" onclick="setFishLevel(9)">Lv9</button>
    <button class="debug-btn" id="db-fl10" onclick="setFishLevel(10)">Lv10+</button>
  </div>
  <div class="debug-row">
    <span class="debug-label">退化狀態</span>
    <button class="debug-btn active" id="db-deg0" onclick="setDegrade(0)">正常</button>
    <button class="debug-btn" id="db-deg1" onclick="setDegrade(1)">停滯(1天)</button>
    <button class="debug-btn" id="db-deg2" onclick="setDegrade(2)">退化(2天)</button>
    <button class="debug-btn" id="db-deg4" onclick="setDegrade(4)">退化(4天)</button>
  </div>
  <div class="debug-row">
    <span class="debug-label">其他</span>
    <button class="debug-btn" onclick="triggerGiftBox()">觸發禮盒</button>
    <button class="debug-btn" onclick="triggerMaxReward()">最大獎慶祝</button>
    <button class="debug-btn" onclick="openDialog()">重開 Dialog</button>
  </div>
</div>

<script>
// === CONFIG ===
const BONUS_PCT = { 1:100, 2:120, 3:130, 4:140, 5:150, 6:180, 7:200 };
const AMOUNTS = { // NTD prices per display
  first:  [130],
  normal: [130, 370, 590],
};
const FISH_TABLE = [
  null,
  { emoji:'🐟', stage:'幼魚', bg:'bg-plain',   label:'透明小金魚' },
  { emoji:'🐠', stage:'幼魚', bg:'bg-plain',   label:'橘色小金魚' },
  { emoji:'🐡', stage:'幼魚', bg:'bg-seaweed', label:'紅白小金魚' },
  { emoji:'🐙', stage:'成魚', bg:'bg-seaweed', label:'金魚（單尾）' },
  { emoji:'🦑', stage:'成魚', bg:'bg-coral',   label:'金魚（雙尾）' },
  { emoji:'🦐', stage:'成魚', bg:'bg-coral',   label:'琉金（大尾）' },
  { emoji:'🐊', stage:'錦鯉', bg:'bg-stone',   label:'錦鯉（白底紅紋）' },
  { emoji:'🦈', stage:'錦鯉', bg:'bg-stone',   label:'錦鯉（黃金）' },
  { emoji:'🐬', stage:'錦鯉', bg:'bg-stone',   label:'錦鯉（大正三色）' },
  { emoji:'🐉', stage:'龍魚', bg:'bg-golden',  label:'金龍魚' },
];

// === STATE ===
const S = {
  playerType: 'first', // 'first' | 'return' | 'done'
  day: 1,
  fishLevel: 1,
  degradeDays: 0,
  selectedAmt: 130,
  accum: 0,
  hasPurchased: false,
};

// === DATA ===
function getFish(lv) {
  const idx = Math.min(lv, 10);
  return FISH_TABLE[idx] || FISH_TABLE[10];
}
function getBonusPct(day) {
  return BONUS_PCT[Math.min(day, 7)] || 200;
}
function getPrices(type) {
  if (type === 'first') return [130];
  return [130, 370, 590];
}
function getCoinStr(n) {
  return n.toLocaleString('zh-TW');
}
function calcCoins(ndt, pct) {
  return Math.floor(ndt * 100 * (1 + pct / 100));
}
function getPreCopy(day, type) {
  if (type === 'first') return '首次餵食限定・今日加贈 +' + getBonusPct(1) + '%，立即體驗！';
  const copies = {
    1: '今日加贈 +' + getBonusPct(1) + '%，每日餵食魚越來越大！',
    2: '今日限贈禮盒 ×1！再餵一次最高加贈 +' + getBonusPct(2) + '%',
    3: '再餵一次，大獎升級 ' + getCoinStr(calcCoins(590, getBonusPct(3))) + ' 神幣！',
    4: '今日限贈禮盒 ×1！再餵一次最高加贈 +' + getBonusPct(4) + '%',
    5: '再餵一次，大獎升級 ' + getCoinStr(calcCoins(590, getBonusPct(5))) + ' 神幣！',
    6: '再餵一次，明日魚升級錦鯉！',
    7: '今日加贈 +' + getBonusPct(7) + '%，持續餵食衝龍魚！',
  };
  return copies[Math.min(day, 7)];
}
function getStageDecoDays(day) {
  // Which deco items to show on tank bottom
  return { showPlants: day >= 3, showCoral: day >= 6 };
}

// === CORE LOGIC ===
function applyDegradeToFishLevel(level, days) {
  if (days < 2) return level;
  const drops = Math.floor(days / 2);
  return Math.max(1, level - drops);
}
function getDegradeState(days) {
  if (days === 0) return 'normal';
  if (days === 1) return 'stagnant';
  return 'degraded';
}

// === UI UPDATE ===
function renderEntryIcon() {
  const fish = getFish(S.fishLevel);
  document.getElementById('entry-fish').textContent = S.degradeDays >= 2 ? '🐟' : fish.emoji;
  document.getElementById('entry-bonus').textContent = '+' + getBonusPct(S.day) + '%';
  const badge = document.getElementById('badge-first');
  badge.style.display = S.playerType === 'first' ? 'block' : 'none';
}

function renderDialog() {
  const overlay = document.getElementById('overlay');
  const dFirst  = document.getElementById('dialog-first');
  const dStd    = document.getElementById('dialog-standard');

  if (S.playerType === 'first') {
    dFirst.style.display = 'block';
    dStd.style.display   = 'none';
    renderFirstDialog();
  } else {
    dFirst.style.display = 'none';
    dStd.style.display   = 'block';
    renderStdDialog();
  }
}

function renderFirstDialog() {
  const pct = getBonusPct(1);
  document.getElementById('first-bonus-pct').textContent = '+' + pct + '%';
  document.getElementById('first-pct').textContent = '+' + pct + '%';
  renderAmountRow('amount-row-first', [130], 130, 'first');
  document.getElementById('pre-copy-first').textContent = getPreCopy(1, 'first');
}

function renderStdDialog() {
  const lv     = applyDegradeToFishLevel(S.fishLevel, S.degradeDays);
  const fish   = getFish(lv);
  const pct    = getBonusPct(S.day);
  const dstate = getDegradeState(S.degradeDays);

  // Header
  document.getElementById('vip-badge').textContent = '一般探索員 · +' + pct + '%';

  // Degrade warning
  const warn = document.getElementById('degrade-warn');
  const msg  = document.getElementById('degrade-msg');
  if (S.degradeDays >= 4) {
    warn.classList.add('show');
    msg.textContent = '⚠️ 魚需要你！已縮小 ' + Math.floor(S.degradeDays/2) + ' 級';
  } else if (S.degradeDays >= 2) {
    warn.classList.add('show');
    msg.textContent = '魚變小了！快回來餵食（-' + Math.floor(S.degradeDays/2) + ' 級）';
  } else {
    warn.classList.remove('show');
  }

  // Fish tank
  const tankBg = document.getElementById('tank-bg');
  tankBg.className = 'tank-bg ' + fish.bg;
  const fishEl = document.getElementById('fish-display');
  fishEl.textContent = fish.emoji;
  fishEl.className = '';
  if (dstate === 'stagnant') fishEl.classList.add('stagnant');
  else if (dstate === 'degraded') fishEl.classList.add('degraded');

  // Fish size scales with level
  const size = Math.min(30 + lv * 5, 80);
  fishEl.style.fontSize = size + 'px';

  // Labels
  document.getElementById('tank-level-label').textContent =
    '第 ' + lv + ' 級・' + fish.stage;
  document.getElementById('tank-accum').textContent =
    '本週加贈 ' + getCoinStr(S.accum) + ' 神幣';

  // Amount row
  renderAmountRow('amount-row-std', getPrices('normal'), S.selectedAmt, 'std');

  // Pre-copy
  document.getElementById('pre-copy-std').textContent = getPreCopy(S.day, 'return');

  // Buy button
  const buyBtn = document.getElementById('buy-btn-std');
  if (S.playerType === 'done') {
    buyBtn.className = 'buy-btn purchased';
    buyBtn.innerHTML = '今日已餵食 · ' + getCountdownStr();
  } else {
    buyBtn.className = 'buy-btn active';
    const coins = calcCoins(S.selectedAmt, pct);
    buyBtn.innerHTML =
      '餵魚・NT$' + S.selectedAmt + '・加贈 +' + pct + '%<br>' +
      '<span style="font-size:11px;font-weight:400;color:#8B6914">+' + getCoinStr(coins - S.selectedAmt * 100) + ' 神幣</span>';
  }

  // Upgrade hint
  const hint = document.getElementById('upgrade-hint');
  if (S.playerType !== 'done' && lv < 10) {
    hint.classList.add('show');
    hint.textContent = '下個月達成 NT$1,000 儲值，加贈提升至 +' + (pct + 20) + '%';
  } else {
    hint.classList.remove('show');
  }
}

function renderAmountRow(rowId, prices, selected, which) {
  const row = document.getElementById(rowId);
  row.innerHTML = '';
  prices.forEach(p => {
    const b = document.createElement('div');
    b.className = 'amount-btn' + (p === selected ? ' active' : '');
    b.innerHTML = 'NT$' + p + '<div class="amt-ndt">+' + getBonusPct(S.day) + '%</div>';
    b.onclick = () => {
      S.selectedAmt = p;
      if (which === 'std') renderStdDialog();
      else renderFirstDialog();
    };
    row.appendChild(b);
  });
}

function getCountdownStr() {
  return '11:42:07'; // static demo
}

// === EVENT BINDING ===
function openDialog() {
  document.getElementById('overlay').classList.add('show');
  renderDialog();
}
function closeDialog() {
  document.getElementById('overlay').classList.remove('show');
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeDialog();
}

function handleBuy(which) {
  if (S.playerType === 'done') return;
  runBuyAnimation(which);
}

function toggleDebug() {
  const p = document.getElementById('debug-panel');
  p.classList.toggle('show');
}

function setDbBtnActive(group, activeId) {
  document.querySelectorAll('[id^="' + group + '"]').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(activeId);
  if (el) el.classList.add('active');
}

function setPlayerType(t) {
  S.playerType = t;
  setDbBtnActive('db-first', 'db-' + (t === 'first' ? 'first' : t === 'return' ? 'return' : 'done'));
  if (t === 'first') { S.degradeDays = 0; S.day = 1; }
  renderEntryIcon();
}

function setDay(d) {
  S.day = d;
  ['db-d1','db-d2','db-d3','db-d4','db-d5','db-d6','db-d7'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('db-d' + d).classList.add('active');
}

function setFishLevel(lv) {
  S.fishLevel = lv;
  ['db-fl1','db-fl3','db-fl5','db-fl7','db-fl9','db-fl10'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  const key = lv >= 10 ? 'db-fl10' : 'db-fl' + lv;
  const el = document.getElementById(key);
  if (el) el.classList.add('active');
  renderEntryIcon();
}

function setDegrade(days) {
  S.degradeDays = days;
  ['db-deg0','db-deg1','db-deg2','db-deg4'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('db-deg' + days).classList.add('active');
}

function triggerGiftBox() {
  closeDialog();
  showGiftBox();
}
function triggerMaxReward() {
  closeDialog();
  runBuyAnimation('std', true);
}

// === BUY ANIMATION ===
function runBuyAnimation(which, forceMax) {
  const overlay = document.getElementById('anim-overlay');
  overlay.innerHTML = '';
  overlay.classList.add('show');
  overlay.style.display = 'flex';
  overlay.style.alignItems = 'center';
  overlay.style.justifyContent = 'center';

  const pct   = getBonusPct(S.day);
  const amt   = S.selectedAmt;
  const coins = calcCoins(amt, pct);
  const isMax = forceMax || (S.day >= 7 && Math.random() < 0.4);

  // Step 1: fish food drop
  const wrap = document.createElement('div');
  wrap.className = 'anim-center';
  wrap.innerHTML = '<div class="food-drop">🍩</div>';
  overlay.appendChild(wrap);

  setTimeout(() => {
    wrap.innerHTML = '';

    // Step 2: fish grow
    const fish = getFish(Math.min(S.fishLevel + 1, 10));
    const growDiv = document.createElement('div');
    growDiv.className = 'grow-flash';
    growDiv.textContent = fish.emoji;
    if (isMax) {
      growDiv.style.filter = 'drop-shadow(0 0 20px gold)';
    }
    wrap.appendChild(growDiv);

    if (isMax) {
      // Gold particle burst
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'coin-fly';
        p.textContent = '✨';
        p.style.left = '50%';
        p.style.top  = '50%';
        const angle = (i / 12) * Math.PI * 2;
        const dist  = 80 + Math.random() * 60;
        p.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--cy', Math.sin(angle) * dist + 'px');
        p.style.animationDelay = (Math.random() * 0.3) + 's';
        overlay.appendChild(p);
      }
    }

    // Step 3: coins fly + result
    setTimeout(() => {
      wrap.innerHTML = '';
      const coinRes = document.createElement('div');
      coinRes.className = 'coin-result';
      coinRes.innerHTML =
        (isMax ? '🎊 ' : '') + '+' + getCoinStr(coins) + ' 神幣' + (isMax ? ' 🎊' : '');
      wrap.appendChild(coinRes);

      S.accum += coins;
      S.fishLevel = Math.min(S.fishLevel + 1, 12);

      // Step 4: gift or tomorrow
      const hasGift = S.day === 2 || S.day === 4 || (S.day >= 7 && Math.random() < 0.5);
      setTimeout(() => {
        wrap.innerHTML = '';
        if (hasGift) {
          showGiftBoxInOverlay(overlay, wrap);
        } else {
          showTomorrowPreview(wrap);
        }
      }, 1400);
    }, 800);
  }, 900);
}

function showGiftBox() {
  const overlay = document.getElementById('anim-overlay');
  overlay.innerHTML = '';
  overlay.classList.add('show');
  overlay.style.display = 'flex';
  overlay.style.alignItems = 'center';
  overlay.style.justifyContent = 'center';
  const wrap = document.createElement('div');
  wrap.className = 'anim-center';
  overlay.appendChild(wrap);
  showGiftBoxInOverlay(overlay, wrap);
}

function showGiftBoxInOverlay(overlay, wrap) {
  wrap.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'gift-box';
  box.textContent = '🎁';
  box.title = '點擊開啟禮盒';
  const msg = document.createElement('div');
  msg.className = 'gift-open-msg';
  msg.textContent = '禮盒浮出！點擊開啟';
  wrap.appendChild(box);
  wrap.appendChild(msg);
  box.onclick = () => {
    box.textContent = '🎉';
    msg.textContent = '獎勵已入帳！神幣加贈券 ×1';
    setTimeout(() => showTomorrowPreview(wrap), 1200);
  };
}

function showTomorrowPreview(wrap) {
  wrap.innerHTML = '';
  const nextLv   = Math.min(S.fishLevel + 1, 12);
  const nextFish = getFish(nextLv);
  const nextPct  = getBonusPct(Math.min(S.day + 1, 7));
  const nextCoins = calcCoins(S.selectedAmt, nextPct);
  const div = document.createElement('div');
  div.className = 'tomorrow-preview';
  div.innerHTML =
    '<h3>🌟 明日預告</h3>' +
    '<div class="fish-preview">' + nextFish.emoji + '</div>' +
    '<p>明日再餵，魚升至第 ' + nextLv + ' 級<br>' +
    nextFish.stage + '・最高可得<br>' +
    '<strong style="color:var(--gold)">' + getCoinStr(nextCoins) + '</strong> 神幣</p>' +
    '<button class="preview-close" onclick="finishBuy()">知道了</button>';
  wrap.appendChild(div);
}

function finishBuy() {
  document.getElementById('anim-overlay').classList.remove('show');
  document.getElementById('anim-overlay').style.display = 'none';
  S.playerType = 'done';
  S.hasPurchased = true;
  S.degradeDays = 0;
  renderEntryIcon();
  renderDialog(); // 刷新為已購買狀態，Dialog 維持開啟
}

// === INIT ===
(function init() {
  // Countdown ticker
  let remaining = 11 * 3600 + 42 * 60 + 7;
  setInterval(() => {
    remaining = Math.max(0, remaining - 1);
    const h = String(Math.floor(remaining / 3600)).padStart(2, '0');
    const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
    const s = String(remaining % 60).padStart(2, '0');
    const str = h + ':' + m + ':' + s;
    const el1 = document.getElementById('cd-first');
    const el2 = document.getElementById('cd-std');
    if (el1) el1.textContent = str;
    if (el2) el2.textContent = str;
  }, 1000);

  renderEntryIcon();

  // Debug panel open by default
  document.getElementById('debug-panel').classList.add('show');

  // Auto-open after short delay for demo
  setTimeout(openDialog, 600);
})();
</script>
</body>
</html>
